services:
  app:
    build: .
    container_name: research-radar
    ports:
      - "3001:3000"
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/research_radar
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: research-radar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: