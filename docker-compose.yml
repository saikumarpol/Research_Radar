services:

  db:
    image: postgres:16-alpine
    container_name: research-radar-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: research_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - research-radar-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: research-radar
    restart: unless-stopped

    ports:
      - "3001:3000"
      - "8001:8000"

    env_file:
      - backend/.env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/research_radar

    depends_on:
      db:
        condition: service_healthy

    networks:
      - research-radar-network


volumes:
  postgres_data:


networks:
  research-radar-network: